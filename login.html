<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Painel Administrativo</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/identidade.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="img/3.png">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8f9ff 0%, #f0f2ff 100%);
            padding: 20px;
        }

        .login-container {
            background: var(--branco);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(74, 144, 217, 0.15);
            padding: 50px;
            max-width: 450px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: var(--gradiente);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-logo img {
            height: 60px;
            margin-bottom: 16px;
        }

        .login-logo h1 {
            font-size: 24px;
            color: var(--preto);
            margin-bottom: 8px;
        }

        .login-logo p {
            color: var(--cinza);
            font-size: 14px;
        }

        .login-form .form-group {
            margin-bottom: 20px;
        }

        .login-form label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--preto);
        }

        .login-form .input-group {
            position: relative;
        }

        .login-form .input-group i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            z-index: 1;
        }

        .login-form input {
            width: 100%;
            padding: 14px 14px 14px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: var(--transition);
        }

        .login-form input:focus {
            border-color: var(--azul);
            outline: none;
            box-shadow: 0 0 0 4px rgba(74, 144, 217, 0.1);
        }

        .login-form .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--gradiente);
            color: var(--branco);
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(74, 144, 217, 0.3);
        }

        .login-form .btn-login:hover {
            background: var(--gradiente-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(74, 144, 217, 0.4);
        }

        .login-form .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            color: var(--cinza);
            font-size: 14px;
        }

        .login-error {
            background: #fee;
            color: #c62828;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .login-error.show {
            display: flex;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-logo">
            <img src="img/1.png" alt="Logo">
            <h1>Painel Administrativo</h1>
            <p>Faça login para gerenciar o site</p>
        </div>

        <div class="login-error" id="loginError">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorMessage">Credenciais inválidas. Tente novamente.</span>
        </div>

        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="admin@palestrante.com" value="admin@palestrante.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="senha" placeholder="••••••••" value="admin123" required>
                </div>
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                <i class="fas fa-sign-in-alt"></i> Entrar
            </button>
        </form>

        <div class="login-footer">
            <p>Credenciais padrão: admin@palestrante.com / admin123</p>
        </div>
    </div>

    <script>
        console.log('🔵 Página de login carregada!');

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            console.log('🔵 Formulário enviado!');

            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const btn = document.getElementById('btnLogin');
            const errorDiv = document.getElementById('loginError');
            const errorMsg = document.getElementById('errorMessage');

            errorDiv.classList.remove('show');

            if (!email || !senha) {
                errorMsg.textContent = 'Por favor, preencha todos os campos!';
                errorDiv.classList.add('show');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Entrando...';

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const data = await response.json();
                console.log('🔵 Resposta:', data);

                if (response.ok) {
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('adminUser', JSON.stringify(data.usuario));
                    window.location.href = '/admin.html';
                } else {
                    errorMsg.textContent = data.error || 'Credenciais inválidas!';
                    errorDiv.classList.add('show');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Entrar';
                }
            } catch (error) {
                console.error('❌ Erro:', error);
                errorMsg.textContent = 'Erro de conexão. Verifique sua internet.';
                errorDiv.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Entrar';
            }
        });

        // Verificar se já está logado
        if (localStorage.getItem('adminToken')) {
            window.location.href = '/admin.html';
        }
    </script>
</body>
</html>
