<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Depoimentos</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="img/1.png">
</head>
<body>
    <div class="admin-container">
        <!-- SIDEBAR -->
        <aside class="admin-sidebar" id="sidebar">
            <div class="admin-sidebar__logo">
                <img src="img/1.png" alt="Logo">
                <h2>Admin</h2>
            </div>
            <ul class="admin-sidebar__menu">
                <li><a href="admin.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="admin-eventos.html"><i class="fas fa-calendar-alt"></i> Eventos</a></li>
                <li><a href="admin-produtos.html"><i class="fas fa-box"></i> Produtos</a></li>
                <li><a href="admin-depoimentos.html" class="active"><i class="fas fa-comment-dots"></i> Depoimentos</a></li>
                <li><a href="admin-leads.html"><i class="fas fa-users"></i> Leads</a></li>
            </ul>
            <div class="admin-sidebar__footer">
                <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sair</button>
            </div>
        </aside>

        <!-- MAIN -->
        <main class="admin-main">
            <div class="admin-header">
                <div>
                    <button class="btn-toggle-sidebar" id="btnToggleSidebar"><i class="fas fa-bars"></i></button>
                    <h1>Gerenciar Depoimentos</h1>
                </div>
                <button class="btn-primary" onclick="openModalDepoimento()"><i class="fas fa-plus"></i> Novo Depoimento</button>
            </div>

            <div class="admin-table-container">
                <div class="admin-table-container__header">
                    <h3>Todos os Depoimentos</h3>
                    <input type="text" placeholder="Buscar depoimento..." id="searchDepoimento" onkeyup="filterTable('depoimentosTable', this.value)">
                </div>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Texto</th>
                            <th>Avaliação</th>
                            <th>Foto</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="depoimentosTable">
                        <tr><td colspan="6" style="text-align:center;padding:30px;color:var(--cinza);">Carregando...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- MODAL DEPOIMENTO -->
    <div class="admin-modal" id="modalDepoimento">
        <div class="admin-modal__content">
            <button class="admin-modal__close" onclick="closeModalDepoimento()">&times;</button>
            <h2 class="admin-modal__title" id="modalDepoimentoTitle">Novo Depoimento</h2>
            <form id="formDepoimento" onsubmit="saveDepoimento(event)">
                <input type="hidden" id="depoimento_id">
                
                <div class="form-group">
                    <label for="depoimento_nome">Nome *</label>
                    <input type="text" id="depoimento_nome" required>
                </div>
                
                <div class="form-group">
                    <label for="depoimento_texto">Texto *</label>
                    <textarea id="depoimento_texto" rows="4" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="depoimento_avaliacao">Avaliação (Estrelas)</label>
                    <select id="depoimento_avaliacao">
                        <option value="5">⭐⭐⭐⭐⭐ (5 estrelas)</option>
                        <option value="4">⭐⭐⭐⭐ (4 estrelas)</option>
                        <option value="3">⭐⭐⭐ (3 estrelas)</option>
                        <option value="2">⭐⭐ (2 estrelas)</option>
                        <option value="1">⭐ (1 estrela)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="depoimento_foto">URL da Foto</label>
                    <input type="text" id="depoimento_foto" placeholder="/uploads/depoimento.jpg">
                </div>
                
                <button type="submit" class="btn-submit">Salvar</button>
            </form>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('adminToken');
            if (!token) window.location.href = '/login.html';
            loadDepoimentos();
        });
    </script>
</body>
</html>
